<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <defs>
      <radialGradient id="sunGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#fff8db" />
        <stop offset="60%" stop-color="#f0f7cc" />
        <stop offset="100%" stop-color="#ddefb0" />
      </radialGradient>
    </defs>
    <rect width="1000" height="1000" fill="url(#sunGrad)" />
    <g stroke="#d0e599" stroke-width="3" opacity="0.4" stroke-dasharray="16 20">
      <line x1="500" y1="500" x2="100" y2="100" />
      <line x1="500" y1="500" x2="900" y2="100" />
      <line x1="500" y1="500" x2="500" y2="50" />
      <line x1="500" y1="500" x2="100" y2="500" />
      <line x1="500" y1="500" x2="900" y2="500" />
    </g>
    <circle cx="500" cy="500" r="410" fill="none" stroke="#c8e285" stroke-width="4" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#a8561d" />
      <circle cx="275" cy="725" r="32" fill="#d9833b" />
      <circle cx="268" cy="718" r="18" fill="#f0aa65" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="330" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="355" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="380" cy="835" r="10" fill="#f5a6b3" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="620" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="645" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="670" cy="835" r="10" fill="#f5a6b3" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#a8561d" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#d9833b" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#ffeed9" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#a8561d" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#d9833b" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f5a6b3" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#a8561d" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#d9833b" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f5a6b3" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#a8561d" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#d9833b" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#f0aa65" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#f0aa65" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#f0aa65" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#7a421b" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#533728" />
      <path d="M500 491 v12" stroke="#533728" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-stuffed-cheeks">
      <!-- Puffed little hamster mouth with acorn crumb -->
      <path d="M475 508 Q500 518 525 508" fill="none" stroke="#4a2a1b" stroke-width="4" stroke-linecap="round" />
      <circle cx="500" cy="515" r="4" fill="#a86d36" />
      <circle cx="512" cy="520" r="2.5" fill="#a86d36" />
    </g>
  
  
    <g id="eyes-chill-sleepy">
      <!-- Relaxed half-lidded eyes -->
      <ellipse cx="410" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="410" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="406" cy="430" r="5" fill="#ffffff" />
      <path d="M374 420 Q410 410 446 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
      <ellipse cx="590" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="590" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="586" cy="430" r="5" fill="#ffffff" />
      <path d="M554 420 Q590 410 626 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
    </g>
  
  <!-- Accessory & Clothing -->
  
    <g id="acc-runner-bib">
      <!-- White athletic race number bib pinned to chest -->
      <rect x="420" y="605" width="160" height="110" rx="8" fill="#ffffff" stroke="#131b27" stroke-width="4" />
      <rect x="426" y="611" width="148" height="24" fill="#ee5253" />
      <text x="500" y="628" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">SQUEEKRUNNER</text>
      <text x="500" y="692" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#131b27" text-anchor="middle">42</text>
      <!-- Safety pins -->
      <circle cx="430" cy="615" r="3.5" fill="#95a5a6" />
      <circle cx="570" cy="615" r="3.5" fill="#95a5a6" />
      <circle cx="430" cy="705" r="3.5" fill="#95a5a6" />
      <circle cx="570" cy="705" r="3.5" fill="#95a5a6" />
    </g>
  
  <!-- Headwear -->
  
    <!-- Natural fluffy head tuft -->
    <path d="M485 305 Q500 280 515 305 Q505 295 485 305 Z" fill="#d9833b" opacity="0.6" />
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-brass-wrench">
      <!-- Wheel tuning tool -->
      <g transform="translate(600, 590) rotate(35)">
        <rect x="35" y="40" width="22" height="110" rx="6" fill="#d4af37" stroke="#997a15" stroke-width="3.5" />
        <!-- Wrench head -->
        <circle cx="46" cy="35" r="32" fill="#d4af37" stroke="#997a15" stroke-width="3.5" />
        <rect x="32" y="10" width="28" height="34" fill="#f4ebd9" stroke="#997a15" stroke-width="3" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="590" cy="660" rx="32" ry="24" transform="rotate(-15 590 660)" fill="#a8561d" />
      <ellipse cx="590" cy="658" rx="30" ry="22" transform="rotate(-15 590 658)" fill="#d9833b" />
      <circle cx="582" cy="660" r="7" fill="#f5a6b3" />
      <circle cx="594" cy="663" r="7" fill="#f5a6b3" />
      <circle cx="606" cy="662" r="6" fill="#f5a6b3" />

      <!-- Right Paw -->
      <ellipse cx="670" cy="680" rx="32" ry="24" transform="rotate(15 670 680)" fill="#a8561d" />
      <ellipse cx="670" cy="678" rx="30" ry="22" transform="rotate(15 670 678)" fill="#d9833b" />
      <circle cx="654" cy="682" r="6" fill="#f5a6b3" />
      <circle cx="666" cy="683" r="7" fill="#f5a6b3" />
      <circle cx="678" cy="680" r="7" fill="#f5a6b3" />
    </g>
  
    </g>
  
</svg>