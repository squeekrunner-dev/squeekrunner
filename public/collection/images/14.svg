<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <defs>
      <radialGradient id="sunGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#fff8db" />
        <stop offset="60%" stop-color="#f0f7cc" />
        <stop offset="100%" stop-color="#ddefb0" />
      </radialGradient>
    </defs>
    <rect width="1000" height="1000" fill="url(#sunGrad)" />
    <g stroke="#d0e599" stroke-width="3" opacity="0.4" stroke-dasharray="16 20">
      <line x1="500" y1="500" x2="100" y2="100" />
      <line x1="500" y1="500" x2="900" y2="100" />
      <line x1="500" y1="500" x2="500" y2="50" />
      <line x1="500" y1="500" x2="100" y2="500" />
      <line x1="500" y1="500" x2="900" y2="500" />
    </g>
    <circle cx="500" cy="500" r="410" fill="none" stroke="#c8e285" stroke-width="4" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#854e2f" />
      <circle cx="275" cy="725" r="32" fill="#b57954" />
      <circle cx="268" cy="718" r="18" fill="#d49b77" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#854e2f" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#b57954" />
      <circle cx="330" cy="835" r="10" fill="#f7acbb" />
      <circle cx="355" cy="840" r="10" fill="#f7acbb" />
      <circle cx="380" cy="835" r="10" fill="#f7acbb" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#854e2f" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#b57954" />
      <circle cx="620" cy="835" r="10" fill="#f7acbb" />
      <circle cx="645" cy="840" r="10" fill="#f7acbb" />
      <circle cx="670" cy="835" r="10" fill="#f7acbb" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#854e2f" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#b57954" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#faede2" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#854e2f" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#b57954" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f7acbb" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#854e2f" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#b57954" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f7acbb" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#854e2f" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#b57954" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#d49b77" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#854e2f" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#d49b77" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#854e2f" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#d49b77" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f7acbb" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f7acbb" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#6c3d23" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#482a1b" />
      <path d="M500 491 v12" stroke="#482a1b" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-determined-grit">
      <!-- Confident runner toothy bar -->
      <path d="M468 506 L532 506" stroke="#4a2a1b" stroke-width="4" stroke-linecap="round" />
      <rect x="474" y="508" width="52" height="11" rx="4" fill="#ffffff" stroke="#4a2a1b" stroke-width="2" />
      <line x1="491" y1="508" x2="491" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="500" y1="508" x2="500" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="509" y1="508" x2="509" y2="519" stroke="#c9c7be" stroke-width="1.5" />
    </g>
  
  
    <g id="eyes-speed-gaze">
      <!-- Amber glowing irises with speed lines -->
      <ellipse cx="410" cy="425" rx="36" ry="34" fill="#131b27" />
      <ellipse cx="410" cy="425" rx="28" ry="26" fill="#ffaa2b" />
      <circle cx="410" cy="425" r="14" fill="#3a1b05" />
      <circle cx="404" cy="418" r="6" fill="#ffffff" />
      <line x1="330" y1="425" x2="370" y2="425" stroke="#ffaa2b" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="590" cy="425" rx="36" ry="34" fill="#131b27" />
      <ellipse cx="590" cy="425" rx="28" ry="26" fill="#ffaa2b" />
      <circle cx="590" cy="425" r="14" fill="#3a1b05" />
      <circle cx="584" cy="418" r="6" fill="#ffffff" />
      <line x1="630" y1="425" x2="670" y2="425" stroke="#ffaa2b" stroke-width="4" stroke-linecap="round" />
    </g>
  
  <!-- Accessory & Clothing -->
  
  <!-- Headwear -->
  
    <g id="headwear-sweatband">
      <!-- Striped runner sweatband across forehead -->
      <path d="M330 335 Q500 315 670 335 L668 365 Q500 345 332 365 Z" fill="#ffffff" stroke="#131b27" stroke-width="3" />
      <path d="M331 345 Q500 325 669 345 L668 355 Q500 335 332 355 Z" fill="#ee5253" />
      <circle cx="500" cy="340" r="8" fill="#10ac84" />
    </g>
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-sunflower-seed">
      <!-- Classic striped hamster treat -->
      <g transform="translate(590, 600) rotate(18)">
        <path d="M50 0 Q95 80 50 140 Q5 80 50 0 Z" fill="#2d3436" stroke="#131b27" stroke-width="4" />
        <path d="M50 8 Q68 75 50 132" stroke="#dfe6e9" stroke-width="7" fill="none" stroke-linecap="round" />
        <path d="M34 25 Q42 75 34 115" stroke="#b2bec3" stroke-width="4" fill="none" stroke-linecap="round" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="660" rx="32" ry="24" transform="rotate(-15 580 660)" fill="#854e2f" />
      <ellipse cx="580" cy="658" rx="30" ry="22" transform="rotate(-15 580 658)" fill="#b57954" />
      <circle cx="572" cy="660" r="7" fill="#f7acbb" />
      <circle cx="584" cy="663" r="7" fill="#f7acbb" />
      <circle cx="596" cy="662" r="6" fill="#f7acbb" />

      <!-- Right Paw -->
      <ellipse cx="670" cy="670" rx="32" ry="24" transform="rotate(15 670 670)" fill="#854e2f" />
      <ellipse cx="670" cy="668" rx="30" ry="22" transform="rotate(15 670 668)" fill="#b57954" />
      <circle cx="654" cy="672" r="6" fill="#f7acbb" />
      <circle cx="666" cy="673" r="7" fill="#f7acbb" />
      <circle cx="678" cy="670" r="7" fill="#f7acbb" />
    </g>
  
    </g>
  
</svg>