<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <rect width="1000" height="1000" fill="#f4ebd9" />
    <circle cx="500" cy="500" r="440" fill="none" stroke="#e5d4bc" stroke-width="6" stroke-dasharray="24 16" />
    <path d="M120 780 Q500 830 880 780" stroke="#d8c2a3" stroke-width="12" fill="none" stroke-linecap="round" />
    <g fill="#dfcbaf" opacity="0.6">
      <ellipse cx="200" cy="220" rx="14" ry="7" transform="rotate(25 200 220)" />
      <ellipse cx="800" cy="260" rx="18" ry="9" transform="rotate(-30 800 260)" />
      <ellipse cx="160" cy="680" rx="12" ry="6" transform="rotate(45 160 680)" />
      <ellipse cx="840" cy="720" rx="16" ry="8" transform="rotate(-15 840 720)" />
      <ellipse cx="320" cy="140" rx="10" ry="5" transform="rotate(60 320 140)" />
      <ellipse cx="680" cy="150" rx="15" ry="7" transform="rotate(-40 680 150)" />
    </g>
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#362116" />
      <circle cx="275" cy="725" r="32" fill="#533728" />
      <circle cx="268" cy="718" r="18" fill="#784e38" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#362116" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#533728" />
      <circle cx="330" cy="835" r="10" fill="#e595a4" />
      <circle cx="355" cy="840" r="10" fill="#e595a4" />
      <circle cx="380" cy="835" r="10" fill="#e595a4" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#362116" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#533728" />
      <circle cx="620" cy="835" r="10" fill="#e595a4" />
      <circle cx="645" cy="840" r="10" fill="#e595a4" />
      <circle cx="670" cy="835" r="10" fill="#e595a4" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#362116" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#533728" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#edd8c9" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#362116" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#533728" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#e595a4" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#362116" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#533728" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#e595a4" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#362116" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#533728" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#784e38" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#362116" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#784e38" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#362116" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#784e38" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#e595a4" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#e595a4" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#362116" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#22130b" />
      <path d="M500 491 v12" stroke="#22130b" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-joyful-open">
      <!-- Wide open happy mouth -->
      <path d="M465 502 Q500 545 535 502 Z" fill="#6d1b24" stroke="#4a2a1b" stroke-width="3" />
      <!-- Pink tongue -->
      <path d="M480 522 Q500 514 520 522 Q500 542 480 522 Z" fill="#f5a6b3" />
      <!-- Top tiny teeth -->
      <rect x="492" y="502" width="8" height="6" rx="1" fill="#ffffff" />
      <rect x="500" y="502" width="8" height="6" rx="1" fill="#ffffff" />
    </g>
  
  
    <g id="eyes-big-sparkle">
      <!-- Left Eye -->
      <ellipse cx="410" cy="425" rx="36" ry="40" fill="#131b27" />
      <circle cx="398" cy="412" r="14" fill="#ffffff" />
      <circle cx="424" cy="436" r="6" fill="#ffffff" />
      <!-- Right Eye -->
      <ellipse cx="590" cy="425" rx="36" ry="40" fill="#131b27" />
      <circle cx="578" cy="412" r="14" fill="#ffffff" />
      <circle cx="604" cy="436" r="6" fill="#ffffff" />
      <!-- Cute eye shines -->
      <path d="M375 385 Q410 375 445 385" stroke="#4a3124" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M555 385 Q590 375 625 385" stroke="#4a3124" stroke-width="5" stroke-linecap="round" fill="none" />
    </g>
  
  <!-- Accessory & Clothing -->
  
    <g id="acc-red-cape">
      <!-- Windblown speed cape behind arms -->
      <path d="M340 560 Q200 640 160 820 Q320 780 400 700 Z" fill="#c0392b" stroke="#781e14" stroke-width="4" />
      <path d="M660 560 Q800 640 840 820 Q680 780 600 700 Z" fill="#962d22" stroke="#781e14" stroke-width="4" />
      <!-- Gold collar clasp -->
      <circle cx="500" cy="570" r="14" fill="#f1c40f" stroke="#b7950b" stroke-width="3" />
      <circle cx="500" cy="570" r="6" fill="#ee5253" />
    </g>
  
  <!-- Headwear -->
  
    <!-- Natural fluffy head tuft -->
    <path d="M485 305 Q500 280 515 305 Q505 295 485 305 Z" fill="#d9833b" opacity="0.6" />
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-energy-carrot">
      <g transform="translate(590, 595) rotate(-24)">
        <path d="M50 30 Q70 30 70 45 L50 145 L30 45 Q30 30 50 30 Z" fill="#e67e22" stroke="#b95e0c" stroke-width="4" />
        <path d="M40 60 h20 M38 90 h22 M42 120 h12" stroke="#b95e0c" stroke-width="3" stroke-linecap="round" />
        <!-- Green leafy fronds -->
        <path d="M50 30 Q30 5 15 15 M50 30 Q50 -5 50 -10 M50 30 Q70 5 85 15" stroke="#27ae60" stroke-width="6" fill="none" stroke-linecap="round" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="660" rx="32" ry="24" transform="rotate(-15 580 660)" fill="#362116" />
      <ellipse cx="580" cy="658" rx="30" ry="22" transform="rotate(-15 580 658)" fill="#533728" />
      <circle cx="572" cy="660" r="7" fill="#e595a4" />
      <circle cx="584" cy="663" r="7" fill="#e595a4" />
      <circle cx="596" cy="662" r="6" fill="#e595a4" />

      <!-- Right Paw -->
      <ellipse cx="670" cy="675" rx="32" ry="24" transform="rotate(15 670 675)" fill="#362116" />
      <ellipse cx="670" cy="673" rx="30" ry="22" transform="rotate(15 670 673)" fill="#533728" />
      <circle cx="654" cy="677" r="6" fill="#e595a4" />
      <circle cx="666" cy="678" r="7" fill="#e595a4" />
      <circle cx="678" cy="675" r="7" fill="#e595a4" />
    </g>
  
    </g>
  
</svg>