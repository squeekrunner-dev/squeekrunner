<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <rect width="1000" height="1000" fill="#dcf3eb" />
    <g stroke="#bce4d6" stroke-width="12" stroke-linecap="round" opacity="0.7">
      <line x1="80" y1="180" x2="280" y2="60" />
      <line x1="40" y1="360" x2="340" y2="180" />
      <line x1="720" y1="940" x2="960" y2="780" />
      <line x1="660" y1="820" x2="920" y2="660" />
    </g>
    <circle cx="500" cy="500" r="420" fill="none" stroke="#9ed4c0" stroke-width="4" stroke-dasharray="16 12" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#8c4e20" />
      <circle cx="275" cy="725" r="32" fill="#c4793d" />
      <circle cx="268" cy="718" r="18" fill="#e09d67" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#8c4e20" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#c4793d" />
      <circle cx="330" cy="835" r="10" fill="#f8b4bf" />
      <circle cx="355" cy="840" r="10" fill="#f8b4bf" />
      <circle cx="380" cy="835" r="10" fill="#f8b4bf" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#8c4e20" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#c4793d" />
      <circle cx="620" cy="835" r="10" fill="#f8b4bf" />
      <circle cx="645" cy="840" r="10" fill="#f8b4bf" />
      <circle cx="670" cy="835" r="10" fill="#f8b4bf" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#8c4e20" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#c4793d" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#fff5ea" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#8c4e20" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#c4793d" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f8b4bf" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#8c4e20" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#c4793d" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f8b4bf" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#8c4e20" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#c4793d" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#e09d67" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#8c4e20" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#e09d67" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#8c4e20" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#e09d67" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f8b4bf" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f8b4bf" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#6f3915" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#4d2a13" />
      <path d="M500 491 v12" stroke="#4d2a13" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-whistling-ooh">
      <circle cx="500" cy="512" r="10" fill="#6d1b24" stroke="#4a2a1b" stroke-width="3" />
      <ellipse cx="500" cy="510" rx="5" ry="3" fill="#f5a6b3" />
    </g>
  
  
    <g id="eyes-happy-wink">
      <!-- Left Eye Winking Arc -->
      <path d="M380 430 Q410 405 440 430" stroke="#131b27" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M390 436 L375 444" stroke="#131b27" stroke-width="5" stroke-linecap="round" />
      <!-- Right Eye Wide & Happy -->
      <ellipse cx="590" cy="425" rx="36" ry="40" fill="#131b27" />
      <circle cx="578" cy="412" r="14" fill="#ffffff" />
      <circle cx="604" cy="436" r="6" fill="#ffffff" />
      <path d="M555 385 Q590 375 625 385" stroke="#4a3124" stroke-width="5" stroke-linecap="round" fill="none" />
    </g>
  
  <!-- Accessory & Clothing -->
  
  <!-- Headwear -->
  
    <g id="headwear-acorn-beret">
      <!-- Adorable acorn cap beret tilted over right ear -->
      <ellipse cx="610" cy="290" rx="75" ry="40" transform="rotate(22 610 290)" fill="#784e2d" stroke="#422814" stroke-width="3" />
      <!-- Crosshatch acorn texture -->
      <g stroke="#56351d" stroke-width="2.5">
        <line x1="570" y1="280" x2="650" y2="295" />
        <line x1="580" y1="295" x2="640" y2="310" />
      </g>
      <!-- Little acorn stem on top -->
      <path d="M625 268 Q640 245 650 250" stroke="#422814" stroke-width="7" fill="none" stroke-linecap="round" />
    </g>
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-stopwatch">
      <g transform="translate(600, 610)">
        <circle cx="50" cy="60" r="48" fill="#dfe6e9" stroke="#636e72" stroke-width="4" />
        <circle cx="50" cy="60" r="38" fill="#ffffff" stroke="#b2bec3" stroke-width="2" />
        <!-- Top button -->
        <rect x="42" y="4" width="16" height="12" rx="3" fill="#e17055" />
        <!-- Tick marks & hand -->
        <circle cx="50" cy="60" r="4" fill="#d63031" />
        <line x1="50" y1="60" x2="68" y2="42" stroke="#d63031" stroke-width="3" stroke-linecap="round" />
        <line x1="50" y1="28" x2="50" y2="34" stroke="#2d3436" stroke-width="2.5" />
        <line x1="82" y1="60" x2="76" y2="60" stroke="#2d3436" stroke-width="2.5" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="665" rx="32" ry="24" transform="rotate(-15 580 665)" fill="#8c4e20" />
      <ellipse cx="580" cy="663" rx="30" ry="22" transform="rotate(-15 580 663)" fill="#c4793d" />
      <circle cx="572" cy="665" r="7" fill="#f8b4bf" />
      <circle cx="584" cy="668" r="7" fill="#f8b4bf" />
      <circle cx="596" cy="667" r="6" fill="#f8b4bf" />

      <!-- Right Paw -->
      <ellipse cx="680" cy="670" rx="32" ry="24" transform="rotate(15 680 670)" fill="#8c4e20" />
      <ellipse cx="680" cy="668" rx="30" ry="22" transform="rotate(15 680 668)" fill="#c4793d" />
      <circle cx="664" cy="672" r="6" fill="#f8b4bf" />
      <circle cx="676" cy="673" r="7" fill="#f8b4bf" />
      <circle cx="688" cy="670" r="7" fill="#f8b4bf" />
    </g>
  
    </g>
  
</svg>