<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>text { font-family: system-ui, -apple-system, sans-serif; }</style>
  </defs>
  
      <rect width="1000" height="1000" fill="#2b0d06" />
      <!-- Fire speed rings -->
      <circle cx="500" cy="500" r="420" fill="none" stroke="#e74c3c" stroke-width="12" />
      <circle cx="500" cy="500" r="380" fill="none" stroke="#f39c12" stroke-width="8" stroke-dasharray="24 16" />
      <circle cx="500" cy="500" r="340" fill="none" stroke="#f1c40f" stroke-width="4" />
      
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#ba6743" />
      <circle cx="275" cy="725" r="32" fill="#e8926a" />
      <circle cx="268" cy="718" r="18" fill="#f7b494" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#ba6743" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#e8926a" />
      <circle cx="330" cy="835" r="10" fill="#fca5b5" />
      <circle cx="355" cy="840" r="10" fill="#fca5b5" />
      <circle cx="380" cy="835" r="10" fill="#fca5b5" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#ba6743" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#e8926a" />
      <circle cx="620" cy="835" r="10" fill="#fca5b5" />
      <circle cx="645" cy="840" r="10" fill="#fca5b5" />
      <circle cx="670" cy="835" r="10" fill="#fca5b5" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#ba6743" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#e8926a" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#fff0e6" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#ba6743" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#e8926a" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#fca5b5" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#ba6743" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#e8926a" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#fca5b5" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#ba6743" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#e8926a" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#f7b494" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#ba6743" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#f7b494" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#ba6743" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#f7b494" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#fca5b5" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#fca5b5" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#87442f" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#5a3328" />
      <path d="M500 491 v12" stroke="#5a3328" stroke-width="3" stroke-linecap="round" />
    </g>
  
      
    <g id="eyes-speed-gaze">
      <!-- Amber glowing irises with speed lines -->
      <ellipse cx="410" cy="425" rx="36" ry="34" fill="#131b27" />
      <ellipse cx="410" cy="425" rx="28" ry="26" fill="#ffaa2b" />
      <circle cx="410" cy="425" r="14" fill="#3a1b05" />
      <circle cx="404" cy="418" r="6" fill="#ffffff" />
      <line x1="330" y1="425" x2="370" y2="425" stroke="#ffaa2b" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="590" cy="425" rx="36" ry="34" fill="#131b27" />
      <ellipse cx="590" cy="425" rx="28" ry="26" fill="#ffaa2b" />
      <circle cx="590" cy="425" r="14" fill="#3a1b05" />
      <circle cx="584" cy="418" r="6" fill="#ffffff" />
      <line x1="630" y1="425" x2="670" y2="425" stroke="#ffaa2b" stroke-width="4" stroke-linecap="round" />
    </g>
  
      
    <g id="mouth-determined-grit">
      <!-- Confident runner toothy bar -->
      <path d="M468 506 L532 506" stroke="#4a2a1b" stroke-width="4" stroke-linecap="round" />
      <rect x="474" y="508" width="52" height="11" rx="4" fill="#ffffff" stroke="#4a2a1b" stroke-width="2" />
      <line x1="491" y1="508" x2="491" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="500" y1="508" x2="500" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="509" y1="508" x2="509" y2="519" stroke="#c9c7be" stroke-width="1.5" />
    </g>
  
      
    <g id="headwear-sweatband">
      <!-- Striped runner sweatband across forehead -->
      <path d="M330 335 Q500 315 670 335 L668 365 Q500 345 332 365 Z" fill="#ffffff" stroke="#131b27" stroke-width="3" />
      <path d="M331 345 Q500 325 669 345 L668 355 Q500 335 332 355 Z" fill="#ee5253" />
      <circle cx="500" cy="340" r="8" fill="#10ac84" />
    </g>
  
      <!-- Race Bib 98.3 -->
      <g id="leg-bib">
        <rect x="420" y="610" width="160" height="100" rx="8" fill="#ffffff" stroke="#e74c3c" stroke-width="4" />
        <text x="500" y="680" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#c0392b" text-anchor="middle">98.3</text>
      </g>
      
    <g id="held-stopwatch">
      <g transform="translate(600, 610)">
        <circle cx="50" cy="60" r="48" fill="#dfe6e9" stroke="#636e72" stroke-width="4" />
        <circle cx="50" cy="60" r="38" fill="#ffffff" stroke="#b2bec3" stroke-width="2" />
        <!-- Top button -->
        <rect x="42" y="4" width="16" height="12" rx="3" fill="#e17055" />
        <!-- Tick marks & hand -->
        <circle cx="50" cy="60" r="4" fill="#d63031" />
        <line x1="50" y1="60" x2="68" y2="42" stroke="#d63031" stroke-width="3" stroke-linecap="round" />
        <line x1="50" y1="28" x2="50" y2="34" stroke="#2d3436" stroke-width="2.5" />
        <line x1="82" y1="60" x2="76" y2="60" stroke="#2d3436" stroke-width="2.5" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="665" rx="32" ry="24" transform="rotate(-15 580 665)" fill="#ba6743" />
      <ellipse cx="580" cy="663" rx="30" ry="22" transform="rotate(-15 580 663)" fill="#e8926a" />
      <circle cx="572" cy="665" r="7" fill="#fca5b5" />
      <circle cx="584" cy="668" r="7" fill="#fca5b5" />
      <circle cx="596" cy="667" r="6" fill="#fca5b5" />

      <!-- Right Paw -->
      <ellipse cx="680" cy="670" rx="32" ry="24" transform="rotate(15 680 670)" fill="#ba6743" />
      <ellipse cx="680" cy="668" rx="30" ry="22" transform="rotate(15 680 668)" fill="#e8926a" />
      <circle cx="664" cy="672" r="6" fill="#fca5b5" />
      <circle cx="676" cy="673" r="7" fill="#fca5b5" />
      <circle cx="688" cy="670" r="7" fill="#fca5b5" />
    </g>
  
    </g>
  
    
</svg>