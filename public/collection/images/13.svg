<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <rect width="1000" height="1000" fill="#32141a" />
    <circle cx="500" cy="500" r="430" fill="#421a22" />
    <g stroke="#7b2838" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M200 480 L280 500 L200 520" />
      <path d="M260 480 L340 500 L260 520" />
      <path d="M800 480 L720 500 L800 520" />
      <path d="M740 480 L660 500 L740 520" />
    </g>
    <circle cx="500" cy="500" r="400" fill="none" stroke="#9e3247" stroke-width="3" stroke-dasharray="12 16" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#a8561d" />
      <circle cx="275" cy="725" r="32" fill="#d9833b" />
      <circle cx="268" cy="718" r="18" fill="#f0aa65" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="330" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="355" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="380" cy="835" r="10" fill="#f5a6b3" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="620" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="645" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="670" cy="835" r="10" fill="#f5a6b3" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#a8561d" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#d9833b" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#ffeed9" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#a8561d" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#d9833b" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f5a6b3" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#a8561d" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#d9833b" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f5a6b3" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#a8561d" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#d9833b" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#f0aa65" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#f0aa65" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#f0aa65" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#7a421b" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#533728" />
      <path d="M500 491 v12" stroke="#533728" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-whistling-ooh">
      <circle cx="500" cy="512" r="10" fill="#6d1b24" stroke="#4a2a1b" stroke-width="3" />
      <ellipse cx="500" cy="510" rx="5" ry="3" fill="#f5a6b3" />
    </g>
  
  
    <g id="eyes-focused-runner">
      <!-- Determined angled brows -->
      <path d="M370 380 L445 398" stroke="#131b27" stroke-width="8" stroke-linecap="round" />
      <path d="M630 380 L555 398" stroke="#131b27" stroke-width="8" stroke-linecap="round" />
      <!-- Sharp eyes -->
      <ellipse cx="412" cy="430" rx="32" ry="32" fill="#131b27" />
      <circle cx="412" cy="430" r="16" fill="#4d7298" />
      <circle cx="412" cy="430" r="8" fill="#131b27" />
      <circle cx="406" cy="424" r="5" fill="#ffffff" />
      <ellipse cx="588" cy="430" rx="32" ry="32" fill="#131b27" />
      <circle cx="588" cy="430" r="16" fill="#4d7298" />
      <circle cx="588" cy="430" r="8" fill="#131b27" />
      <circle cx="582" cy="424" r="5" fill="#ffffff" />
    </g>
  
  <!-- Accessory & Clothing -->
  
  <!-- Headwear -->
  
    <g id="headwear-miner-helmet">
      <!-- Hard-hat with glowing LED lamp -->
      <path d="M360 320 Q500 220 640 320 Z" fill="#f1c40f" stroke="#b7950b" stroke-width="4" />
      <rect x="345" y="315" width="310" height="18" rx="6" fill="#d4ac0d" stroke="#7d6608" stroke-width="2.5" />
      <!-- Center lamp fixture -->
      <rect x="475" y="270" width="50" height="40" rx="6" fill="#34495e" stroke="#1a252f" stroke-width="2" />
      <ellipse cx="500" cy="290" rx="18" ry="14" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" />
      <!-- Soft light beam glow -->
      <polygon points="500,290 350,140 650,140" fill="#ffffff" opacity="0.15" />
    </g>
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-stopwatch">
      <g transform="translate(600, 610)">
        <circle cx="50" cy="60" r="48" fill="#dfe6e9" stroke="#636e72" stroke-width="4" />
        <circle cx="50" cy="60" r="38" fill="#ffffff" stroke="#b2bec3" stroke-width="2" />
        <!-- Top button -->
        <rect x="42" y="4" width="16" height="12" rx="3" fill="#e17055" />
        <!-- Tick marks & hand -->
        <circle cx="50" cy="60" r="4" fill="#d63031" />
        <line x1="50" y1="60" x2="68" y2="42" stroke="#d63031" stroke-width="3" stroke-linecap="round" />
        <line x1="50" y1="28" x2="50" y2="34" stroke="#2d3436" stroke-width="2.5" />
        <line x1="82" y1="60" x2="76" y2="60" stroke="#2d3436" stroke-width="2.5" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="665" rx="32" ry="24" transform="rotate(-15 580 665)" fill="#a8561d" />
      <ellipse cx="580" cy="663" rx="30" ry="22" transform="rotate(-15 580 663)" fill="#d9833b" />
      <circle cx="572" cy="665" r="7" fill="#f5a6b3" />
      <circle cx="584" cy="668" r="7" fill="#f5a6b3" />
      <circle cx="596" cy="667" r="6" fill="#f5a6b3" />

      <!-- Right Paw -->
      <ellipse cx="680" cy="670" rx="32" ry="24" transform="rotate(15 680 670)" fill="#a8561d" />
      <ellipse cx="680" cy="668" rx="30" ry="22" transform="rotate(15 680 668)" fill="#d9833b" />
      <circle cx="664" cy="672" r="6" fill="#f5a6b3" />
      <circle cx="676" cy="673" r="7" fill="#f5a6b3" />
      <circle cx="688" cy="670" r="7" fill="#f5a6b3" />
    </g>
  
    </g>
  
</svg>