<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>text { font-family: system-ui, -apple-system, sans-serif; }</style>
  </defs>
  
      <rect width="1000" height="1000" fill="#0a0f18" />
      <circle cx="500" cy="500" r="440" fill="none" stroke="#ffcf75" stroke-width="4" stroke-dasharray="16 12" />
      <circle cx="500" cy="500" r="390" fill="#141f30" stroke="#f39c12" stroke-width="8" />
      <!-- Golden Runner Halo -->
      <g stroke="#ffd700" stroke-width="8" opacity="0.8">
        <line x1="500" y1="120" x2="500" y2="880" />
        <line x1="120" y1="500" x2="880" y2="500" />
        <line x1="230" y1="230" x2="770" y2="770" />
        <line x1="230" y1="770" x2="770" y2="230" />
      </g>
      
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#a8561d" />
      <circle cx="275" cy="725" r="32" fill="#d9833b" />
      <circle cx="268" cy="718" r="18" fill="#f0aa65" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="330" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="355" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="380" cy="835" r="10" fill="#f5a6b3" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#a8561d" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#d9833b" />
      <circle cx="620" cy="835" r="10" fill="#f5a6b3" />
      <circle cx="645" cy="840" r="10" fill="#f5a6b3" />
      <circle cx="670" cy="835" r="10" fill="#f5a6b3" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#a8561d" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#d9833b" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#ffeed9" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#a8561d" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#d9833b" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f5a6b3" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#a8561d" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#d9833b" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f5a6b3" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#a8561d" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#d9833b" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#f0aa65" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#f0aa65" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#a8561d" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#f0aa65" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f5a6b3" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#7a421b" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#533728" />
      <path d="M500 491 v12" stroke="#533728" stroke-width="3" stroke-linecap="round" />
    </g>
  
      <!-- Glowing golden eyes -->
      <circle cx="410" cy="425" r="28" fill="#ffd700" stroke="#ffffff" stroke-width="5" />
      <circle cx="590" cy="425" r="28" fill="#ffd700" stroke="#ffffff" stroke-width="5" />
      
    <g id="mouth-joyful-open">
      <!-- Wide open happy mouth -->
      <path d="M465 502 Q500 545 535 502 Z" fill="#6d1b24" stroke="#4a2a1b" stroke-width="3" />
      <!-- Pink tongue -->
      <path d="M480 522 Q500 514 520 522 Q500 542 480 522 Z" fill="#f5a6b3" />
      <!-- Top tiny teeth -->
      <rect x="492" y="502" width="8" height="6" rx="1" fill="#ffffff" />
      <rect x="500" y="502" width="8" height="6" rx="1" fill="#ffffff" />
    </g>
  
      <!-- Master Crown -->
      
    <g id="headwear-golden-crown">
      <!-- 3-pointed royal crown with gems -->
      <polygon points="410,295 440,230 470,275 500,210 530,275 560,230 590,295" fill="#ffcf75" stroke="#b8860b" stroke-width="4" />
      <rect x="410" y="295" width="180" height="24" rx="4" fill="#ffd982" stroke="#b8860b" stroke-width="3" />
      <!-- Jewels -->
      <circle cx="500" cy="307" r="7" fill="#ee5253" />
      <circle cx="445" cy="307" r="5" fill="#10ac84" />
      <circle cx="555" cy="307" r="5" fill="#0984e3" />
    </g>
  
      <!-- First Runner Medallion -->
      <circle cx="500" cy="670" r="50" fill="#ffd700" stroke="#b8860b" stroke-width="6" />
      <text x="500" y="680" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#2d1c02" text-anchor="middle">#001</text>
      
    <g id="held-golden-nut">
      <!-- The iconic Golden Nut of SqueekRunner -->
      <g transform="translate(580, 610) rotate(-12)">
        <ellipse cx="60" cy="70" rx="48" ry="58" fill="#ffd97d" stroke="#b8860b" stroke-width="4" />
        <!-- Acorn cap -->
        <path d="M10 40 Q60 5 110 40 L108 55 Q60 25 12 55 Z" fill="#8a5325" stroke="#4a280c" stroke-width="3.5" />
        <!-- Little green oak leaf on top -->
        <path d="M60 15 Q75 -10 95 -5 Q85 15 60 15 Z" fill="#78b13f" stroke="#4d7723" stroke-width="2.5" />
        <!-- Sparkle on nut -->
        <polygon points="75,55 80,68 93,73 80,78 75,91 70,78 57,73 70,68" fill="#ffffff" opacity="0.9" />
      </g>
      <!-- Hamster paws clasping the item -->
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="660" rx="32" ry="24" transform="rotate(-15 580 660)" fill="#a8561d" />
      <ellipse cx="580" cy="658" rx="30" ry="22" transform="rotate(-15 580 658)" fill="#d9833b" />
      <circle cx="572" cy="660" r="7" fill="#f5a6b3" />
      <circle cx="584" cy="663" r="7" fill="#f5a6b3" />
      <circle cx="596" cy="662" r="6" fill="#f5a6b3" />

      <!-- Right Paw -->
      <ellipse cx="680" cy="675" rx="32" ry="24" transform="rotate(15 680 675)" fill="#a8561d" />
      <ellipse cx="680" cy="673" rx="30" ry="22" transform="rotate(15 680 673)" fill="#d9833b" />
      <circle cx="664" cy="677" r="6" fill="#f5a6b3" />
      <circle cx="676" cy="678" r="7" fill="#f5a6b3" />
      <circle cx="688" cy="675" r="7" fill="#f5a6b3" />
    </g>
  
    </g>
  
    
</svg>