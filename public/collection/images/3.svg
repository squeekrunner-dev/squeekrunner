<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <rect width="1000" height="1000" fill="#dcf3eb" />
    <g stroke="#bce4d6" stroke-width="12" stroke-linecap="round" opacity="0.7">
      <line x1="80" y1="180" x2="280" y2="60" />
      <line x1="40" y1="360" x2="340" y2="180" />
      <line x1="720" y1="940" x2="960" y2="780" />
      <line x1="660" y1="820" x2="920" y2="660" />
    </g>
    <circle cx="500" cy="500" r="420" fill="none" stroke="#9ed4c0" stroke-width="4" stroke-dasharray="16 12" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#854e2f" />
      <circle cx="275" cy="725" r="32" fill="#b57954" />
      <circle cx="268" cy="718" r="18" fill="#d49b77" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#854e2f" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#b57954" />
      <circle cx="330" cy="835" r="10" fill="#f7acbb" />
      <circle cx="355" cy="840" r="10" fill="#f7acbb" />
      <circle cx="380" cy="835" r="10" fill="#f7acbb" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#854e2f" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#b57954" />
      <circle cx="620" cy="835" r="10" fill="#f7acbb" />
      <circle cx="645" cy="840" r="10" fill="#f7acbb" />
      <circle cx="670" cy="835" r="10" fill="#f7acbb" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#854e2f" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#b57954" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#faede2" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#854e2f" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#b57954" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#f7acbb" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#854e2f" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#b57954" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#f7acbb" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#854e2f" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#b57954" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#d49b77" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#854e2f" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#d49b77" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#854e2f" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#d49b77" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#f7acbb" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#f7acbb" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#6c3d23" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#482a1b" />
      <path d="M500 491 v12" stroke="#482a1b" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-buck-teeth">
      <!-- W-shaped hamster lips -->
      <path d="M465 503 Q485 515 500 503 Q515 515 535 503" fill="none" stroke="#4a2a1b" stroke-width="4" stroke-linecap="round" />
      <!-- Signature cute dual hamster teeth! -->
      <rect x="488" y="506" width="11" height="15" rx="2" fill="#ffffff" stroke="#c9c7be" stroke-width="1.5" />
      <rect x="501" y="506" width="11" height="15" rx="2" fill="#ffffff" stroke="#c9c7be" stroke-width="1.5" />
    </g>
  
  
    <g id="eyes-chill-sleepy">
      <!-- Relaxed half-lidded eyes -->
      <ellipse cx="410" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="410" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="406" cy="430" r="5" fill="#ffffff" />
      <path d="M374 420 Q410 410 446 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
      <ellipse cx="590" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="590" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="586" cy="430" r="5" fill="#ffffff" />
      <path d="M554 420 Q590 410 626 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
    </g>
  
  <!-- Accessory & Clothing -->
  
    <g id="acc-heart-pin" transform="translate(420, 615)">
      <path d="M0,8 A8,8 0 0,1 16,8 A8,8 0 0,1 32,8 Q32,20 16,30 Q0,20 0,8 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
      <ellipse cx="8" cy="8" rx="4" ry="2" fill="#ffffff" opacity="0.7" transform="rotate(-30 8 8)" />
    </g>
  
  <!-- Headwear -->
  
    <!-- Natural fluffy head tuft -->
    <path d="M485 305 Q500 280 515 305 Q505 295 485 305 Z" fill="#d9833b" opacity="0.6" />
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-brass-wrench">
      <!-- Wheel tuning tool -->
      <g transform="translate(600, 590) rotate(35)">
        <rect x="35" y="40" width="22" height="110" rx="6" fill="#d4af37" stroke="#997a15" stroke-width="3.5" />
        <!-- Wrench head -->
        <circle cx="46" cy="35" r="32" fill="#d4af37" stroke="#997a15" stroke-width="3.5" />
        <rect x="32" y="10" width="28" height="34" fill="#f4ebd9" stroke="#997a15" stroke-width="3" />
      </g>
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="590" cy="660" rx="32" ry="24" transform="rotate(-15 590 660)" fill="#854e2f" />
      <ellipse cx="590" cy="658" rx="30" ry="22" transform="rotate(-15 590 658)" fill="#b57954" />
      <circle cx="582" cy="660" r="7" fill="#f7acbb" />
      <circle cx="594" cy="663" r="7" fill="#f7acbb" />
      <circle cx="606" cy="662" r="6" fill="#f7acbb" />

      <!-- Right Paw -->
      <ellipse cx="670" cy="680" rx="32" ry="24" transform="rotate(15 670 680)" fill="#854e2f" />
      <ellipse cx="670" cy="678" rx="30" ry="22" transform="rotate(15 670 678)" fill="#b57954" />
      <circle cx="654" cy="682" r="6" fill="#f7acbb" />
      <circle cx="666" cy="683" r="7" fill="#f7acbb" />
      <circle cx="678" cy="680" r="7" fill="#f7acbb" />
    </g>
  
    </g>
  
</svg>