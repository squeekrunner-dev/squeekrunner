<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  
    <defs>
      <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ee7663" />
        <stop offset="45%" stop-color="#f89e6d" />
        <stop offset="100%" stop-color="#fed685" />
      </linearGradient>
    </defs>
    <rect width="1000" height="1000" fill="url(#sunsetGrad)" />
    <circle cx="500" cy="520" r="380" fill="#fff" opacity="0.18" />
    <line x1="80" y1="840" x2="920" y2="840" stroke="#d95d49" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="865" x2="840" y2="865" stroke="#d95d49" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  
  <!-- Special Aura -->
  
  <!-- Hamster Anatomy -->
  
    <g id="hamster-body-group">
      <!-- Ground shadow -->
      <ellipse cx="500" cy="860" rx="270" ry="32" fill="#000000" opacity="0.22" />

      <!-- Fluffy Tail (on left hip) -->
      <circle cx="280" cy="730" r="38" fill="#59341d" />
      <circle cx="275" cy="725" r="32" fill="#8a5a3c" />
      <circle cx="268" cy="718" r="18" fill="#ab7652" />

      <!-- Back Feet (paws on ground) -->
      <ellipse cx="360" cy="835" rx="55" ry="34" fill="#59341d" />
      <ellipse cx="360" cy="830" rx="50" ry="30" fill="#8a5a3c" />
      <circle cx="330" cy="835" r="10" fill="#ea99a9" />
      <circle cx="355" cy="840" r="10" fill="#ea99a9" />
      <circle cx="380" cy="835" r="10" fill="#ea99a9" />

      <ellipse cx="640" cy="835" rx="55" ry="34" fill="#59341d" />
      <ellipse cx="640" cy="830" rx="50" ry="30" fill="#8a5a3c" />
      <circle cx="620" cy="835" r="10" fill="#ea99a9" />
      <circle cx="645" cy="840" r="10" fill="#ea99a9" />
      <circle cx="670" cy="835" r="10" fill="#ea99a9" />

      <!-- Main Torso (plump round body) -->
      <ellipse cx="500" cy="650" rx="255" ry="215" fill="#59341d" />
      <ellipse cx="500" cy="645" rx="250" ry="210" fill="#8a5a3c" />

      <!-- Belly / Chest Patch -->
      <ellipse cx="500" cy="670" rx="165" ry="155" fill="#f6ebd9" />

      <!-- Ears (outer fur + soft pink inner) -->
      <g id="ears">
        <!-- Left Ear -->
        <ellipse cx="310" cy="270" rx="68" ry="78" transform="rotate(-15 310 270)" fill="#59341d" />
        <ellipse cx="310" cy="268" rx="64" ry="74" transform="rotate(-15 310 268)" fill="#8a5a3c" />
        <ellipse cx="316" cy="272" rx="44" ry="52" transform="rotate(-15 316 272)" fill="#ea99a9" />

        <!-- Right Ear -->
        <ellipse cx="690" cy="270" rx="68" ry="78" transform="rotate(15 690 270)" fill="#59341d" />
        <ellipse cx="690" cy="268" rx="64" ry="74" transform="rotate(15 690 268)" fill="#8a5a3c" />
        <ellipse cx="684" cy="272" rx="44" ry="52" transform="rotate(15 684 272)" fill="#ea99a9" />
      </g>

      <!-- Head (chubby hamster face) -->
      <ellipse cx="500" cy="460" rx="235" ry="195" fill="#59341d" />
      <ellipse cx="500" cy="455" rx="230" ry="190" fill="#8a5a3c" />

      <!-- Forehead highlight tuft -->
      <ellipse cx="500" cy="340" rx="55" ry="35" fill="#ab7652" opacity="0.6" />

      <!-- Chubby Cheeks (signature hamster feature!) -->
      <ellipse cx="320" cy="505" rx="95" ry="80" transform="rotate(10 320 505)" fill="#59341d" opacity="0.3" />
      <ellipse cx="320" cy="500" rx="95" ry="80" transform="rotate(10 320 500)" fill="#ab7652" />
      <ellipse cx="680" cy="505" rx="95" ry="80" transform="rotate(-10 680 505)" fill="#59341d" opacity="0.3" />
      <ellipse cx="680" cy="500" rx="95" ry="80" transform="rotate(-10 680 500)" fill="#ab7652" />

      <!-- Rosy Cheek Blush -->
      <ellipse cx="350" cy="515" rx="36" ry="22" fill="#ea99a9" opacity="0.6" />
      <ellipse cx="650" cy="515" rx="36" ry="22" fill="#ea99a9" opacity="0.6" />

      <!-- Cheerful Hamster Whiskers -->
      <g stroke="#522f18" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
        <path d="M280 490 Q210 470 140 460" />
        <path d="M275 510 Q200 515 130 520" />
        <path d="M285 530 Q215 550 150 575" />
        <path d="M720 490 Q790 470 860 460" />
        <path d="M725 510 Q800 515 870 520" />
        <path d="M715 530 Q785 550 850 575" />
      </g>

      <!-- Tiny Hamster Nose -->
      <ellipse cx="500" cy="480" rx="15" ry="11" fill="#331d0e" />
      <path d="M500 491 v12" stroke="#331d0e" stroke-width="3" stroke-linecap="round" />
    </g>
  
  <!-- Facial Features -->
  
    <g id="mouth-determined-grit">
      <!-- Confident runner toothy bar -->
      <path d="M468 506 L532 506" stroke="#4a2a1b" stroke-width="4" stroke-linecap="round" />
      <rect x="474" y="508" width="52" height="11" rx="4" fill="#ffffff" stroke="#4a2a1b" stroke-width="2" />
      <line x1="491" y1="508" x2="491" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="500" y1="508" x2="500" y2="519" stroke="#c9c7be" stroke-width="1.5" />
      <line x1="509" y1="508" x2="509" y2="519" stroke="#c9c7be" stroke-width="1.5" />
    </g>
  
  
    <g id="eyes-chill-sleepy">
      <!-- Relaxed half-lidded eyes -->
      <ellipse cx="410" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="410" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="406" cy="430" r="5" fill="#ffffff" />
      <path d="M374 420 Q410 410 446 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
      <ellipse cx="590" cy="430" rx="34" ry="24" fill="#131b27" />
      <circle cx="590" cy="434" r="14" fill="#5c3d2e" />
      <circle cx="586" cy="430" r="5" fill="#ffffff" />
      <path d="M554 420 Q590 410 626 420" stroke="#a8561d" stroke-width="12" fill="none" stroke-linecap="round" />
    </g>
  
  <!-- Accessory & Clothing -->
  
  <!-- Headwear -->
  
    <g id="headwear-golden-crown">
      <!-- 3-pointed royal crown with gems -->
      <polygon points="410,295 440,230 470,275 500,210 530,275 560,230 590,295" fill="#ffcf75" stroke="#b8860b" stroke-width="4" />
      <rect x="410" y="295" width="180" height="24" rx="4" fill="#ffd982" stroke="#b8860b" stroke-width="3" />
      <!-- Jewels -->
      <circle cx="500" cy="307" r="7" fill="#ee5253" />
      <circle cx="445" cy="307" r="5" fill="#10ac84" />
      <circle cx="555" cy="307" r="5" fill="#0984e3" />
    </g>
  
  <!-- Held Item & Front Paws -->
  
    <g id="held-golden-nut">
      <!-- The iconic Golden Nut of SqueekRunner -->
      <g transform="translate(580, 610) rotate(-12)">
        <ellipse cx="60" cy="70" rx="48" ry="58" fill="#ffd97d" stroke="#b8860b" stroke-width="4" />
        <!-- Acorn cap -->
        <path d="M10 40 Q60 5 110 40 L108 55 Q60 25 12 55 Z" fill="#8a5325" stroke="#4a280c" stroke-width="3.5" />
        <!-- Little green oak leaf on top -->
        <path d="M60 15 Q75 -10 95 -5 Q85 15 60 15 Z" fill="#78b13f" stroke="#4d7723" stroke-width="2.5" />
        <!-- Sparkle on nut -->
        <polygon points="75,55 80,68 93,73 80,78 75,91 70,78 57,73 70,68" fill="#ffffff" opacity="0.9" />
      </g>
      <!-- Hamster paws clasping the item -->
      
    <g id="front-paws">
      <!-- Left Paw -->
      <ellipse cx="580" cy="660" rx="32" ry="24" transform="rotate(-15 580 660)" fill="#59341d" />
      <ellipse cx="580" cy="658" rx="30" ry="22" transform="rotate(-15 580 658)" fill="#8a5a3c" />
      <circle cx="572" cy="660" r="7" fill="#ea99a9" />
      <circle cx="584" cy="663" r="7" fill="#ea99a9" />
      <circle cx="596" cy="662" r="6" fill="#ea99a9" />

      <!-- Right Paw -->
      <ellipse cx="680" cy="675" rx="32" ry="24" transform="rotate(15 680 675)" fill="#59341d" />
      <ellipse cx="680" cy="673" rx="30" ry="22" transform="rotate(15 680 673)" fill="#8a5a3c" />
      <circle cx="664" cy="677" r="6" fill="#ea99a9" />
      <circle cx="676" cy="678" r="7" fill="#ea99a9" />
      <circle cx="688" cy="675" r="7" fill="#ea99a9" />
    </g>
  
    </g>
  
</svg>