<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131b27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SqueekRunner" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../site/apple-touch-icon.png" />
    <title>Play — SqueekRunner</title>
    <link rel="icon" type="image/svg+xml" href="../site/favicon.svg" />
    <meta property="og:title" content="SqueekRunner — Tiny paws, big run" />
    <meta property="og:description" content="Double jump, golden nuts, and the pace of a real hamster wheel. Play free in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="description" content="A free arcade runner paced by Squeekchain's real hamster wheel. Double jump, dodge crates and catch confirmed-block bonuses." />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #131b27; overflow: hidden; }
      /* Inside the notch-safe area; the game widens itself to fill it (src/game/viewport.ts). */
      #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); touch-action: none; }
      canvas { display: block; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .rotate { display: none; }
      .home-link { position: fixed; z-index: 50; left: 8px; bottom: 5px; padding: 4px 8px; color: #f4f1df; background: #131b27; font: 12px system-ui; border-radius: 4px; text-decoration: none; }
      .home-link:focus-visible { outline: 3px solid #c4ef6e; outline-offset: 2px; }
      .fullscreen { position: fixed; z-index: 50; right: 8px; bottom: 5px; padding: 6px 12px; color: #131b27; background: #c4ef6e; border: 0; border-radius: 4px; font: 700 12px system-ui; cursor: pointer; }
      .ios-tip { position: fixed; z-index: 50; left: 50%; bottom: 6px; transform: translateX(-50%); max-width: 92vw; padding: 6px 10px; color: #f4f1df; background: rgba(19,27,39,.92); border: 1px solid #3d5446; border-radius: 6px; font: 12px system-ui; display: flex; gap: 8px; align-items: center; }
      .ios-tip button { color: #8b9ba6; background: none; border: 0; font: inherit; cursor: pointer; }
      [hidden] { display: none !important; }
      /* While a run is on, nothing covers the game. */
      body.is-playing .home-link, body.is-playing .fullscreen, body.is-playing .ios-tip { display: none; }
      @media (orientation: portrait) and (max-width: 700px) {
        .rotate { display: block; position: fixed; bottom: 10%; left: 0; width: 100%; text-align: center; color: #8b9ba6; font: 15px system-ui; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <div id="game" role="application" aria-label="SqueekRunner. Space, up arrow or tap to jump. Press again in the air to double jump. P pauses."></div>
    <p id="status" class="sr-only" aria-live="polite">Connecting to the wheel.</p>
    <p class="rotate">Turn your phone sideways for a bigger run.</p>
    <noscript>SqueekRunner needs JavaScript to play.</noscript>
    <a class="home-link" href="../" aria-label="SqueekRunner home">← Back to site</a>
    <button id="fullscreen" class="fullscreen" type="button" hidden>⛶ Full screen</button>
    <p id="ios-tip" class="ios-tip" hidden>iPhone: tap Share → “Add to Home Screen” to play full screen. <button type="button" aria-label="Hide tip">✕</button></p>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
