name = "squeekrunner-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[limits]
cpu_ms = 1000

[vars]
ENVIRONMENT = "production"
THRESHOLD = ""
ENTRIES_OPEN = "false"
SIWE_DOMAIN = "replace-with-pages-domain.invalid"
SIWE_URI = "https://replace-with-pages-domain.invalid/whitelist/"
ALLOWED_ORIGINS = "https://replace-with-pages-domain.invalid"
ENTRY_DEADLINE = ""
SNAPSHOT_AT = ""

[[d1_databases]]
binding = "DB"
database_name = "squeekrunner"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "COLLECTOR"
class_name = "TelemetryCollector"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryCollector"]

[triggers]
crons = ["* * * * *"]
