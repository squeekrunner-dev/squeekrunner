name = "squeekrunner-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[limits]
cpu_ms = 1000

[vars]
ENVIRONMENT = "production"
THRESHOLD = "100000"
APPLICATIONS_OPEN = "false"
SITE_URL = "https://squeekrunner.app"
ALLOWED_ORIGINS = "https://squeekrunner.app,https://www.squeekrunner.app"
APPLICATION_DEADLINE = ""
# Secrets (wrangler secret put): TURNSTILE_SECRET, ADMIN_TOKEN, IP_HASH_SALT, ALCHEMY_KEY

[[d1_databases]]
binding = "DB"
database_name = "squeekrunner"
database_id = "fbd3bd89-bca5-4f13-bef8-85b7af869883"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "COLLECTOR"
class_name = "TelemetryCollector"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryCollector"]

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "api.squeekrunner.app"
custom_domain = true
