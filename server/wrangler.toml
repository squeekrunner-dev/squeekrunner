name = "squeekrunner-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[limits]
cpu_ms = 1000

[vars]
ENVIRONMENT = "production"
THRESHOLD = ""
ENTRIES_OPEN = "false"
SIWE_DOMAIN = "squeekrunner.app"
SIWE_URI = "https://squeekrunner.app/whitelist/"
ALLOWED_ORIGINS = "https://squeekrunner.app,https://www.squeekrunner.app"
ENTRY_DEADLINE = ""
SNAPSHOT_AT = ""

[[d1_databases]]
binding = "DB"
database_name = "squeekrunner"
database_id = "fbd3bd89-bca5-4f13-bef8-85b7af869883"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "COLLECTOR"
class_name = "TelemetryCollector"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryCollector"]

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "api.squeekrunner.app"
custom_domain = true
